name = "vehicle-maintenance-api"
main = "functions/api/[[...route]].js"
compatibility_date = "2024-12-01"

# Development environment (default)
[vars]
ENVIRONMENT = "development"
JWT_SECRET = "dev-secret-key"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "password123"
HOST_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "vehicle-maintenance-db"
database_id = "520f86ac-c0df-48b3-9b25-c98351f52090"

# Production environment
[env.production.vars]
ENVIRONMENT = "production"
JWT_SECRET = "your-super-secret-jwt-key-change-this"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "password123"
HOST_URL = "https://your-app.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "vehicle-maintenance-db"
database_id = "520f86ac-c0df-48b3-9b25-c98351f52090"