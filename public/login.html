<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestione Veicoli</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/theme.js"></script>
</head>

<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white shadow-md rounded-lg p-8 max-w-md w-full">
            <h1 class="text-2xl font-bold mb-6 text-center">Accedi al Sistema</h1>
            
            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <span id="error-text">Errore</span>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input id="username" type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                
                <div>
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input id="password" type="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                
                <div>
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Accedi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
                const loginForm = document.getElementById('login-form');
                const errorMessage = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                loginForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;

                    // Hide previous errors
                    errorMessage.classList.add('hidden');

                    try {
                        // Prepare form data
                        const formData = new FormData();
                        formData.append('username', username);
                        formData.append('password', password);

                        // Send login request using api wrapper
                        const response = await api.postForm('/api/token', formData);

                        const data = await response.json();

                        if (response.ok) {
                            // No need to save token in localStorage, the server will set a cookie
                            // Redirect to admin page
                            window.location.href = '/admin';
                        } else {
                            // Show error message
                            errorText.textContent = data.detail || 'Error during login';
                            errorMessage.classList.remove('hidden');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        errorText.textContent = 'Connection error to server';
                        errorMessage.classList.remove('hidden');
                    }
                });
            });
    </script>
</body>

</html>
