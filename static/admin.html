<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestione Veicoli</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-7">
                    <div class="flex items-center space-x-4">
                        <a href="/admin" class="bg-blue-500 text-white px-3 py-2 rounded-md">Gestione Veicoli</a>
                        <a href="/maintenance" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Tipi
                            Manutenzione</a>
                        <a href="/settings"
                            class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Impostazioni</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logout-btn" class="text-red-500 hover:text-red-700 px-3 py-2 rounded-md">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center">Gestione Veicoli</h1>

        <!-- Form nuovo veicolo -->
        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-8">
            <h2 class="text-xl font-bold mb-4">Aggiungi Nuovo Veicolo</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="license-plate">
                    Targa
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="license-plate"
                    type="text" placeholder="AB123CD">
            </div>
            <button onclick="addVehicle()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Aggiungi Veicolo
            </button>
        </div>

        <!-- QR Code -->
        <div id="qr-code-display" class="hidden bg-white shadow-md rounded px-8 pt-6 pb-8 mb-8">
            <h2 class="text-xl font-bold mb-4">QR Code</h2>
            <img id="qr-code" class="mx-auto max-w-xs" src="" alt="QR Code">
            <button onclick="window.print()"
                class="mt-4 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded block mx-auto">
                Stampa QR Code
            </button>
        </div>

        <!-- Lista veicoli -->
        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8">
            <h2 class="text-xl font-bold mb-4">Lista Veicoli</h2>
            <div id="vehicles-list"></div>
        </div>

        <!-- Modal Attività -->
        <div id="activity-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <h3 id="modal-title" class="text-lg font-bold mb-4">Aggiungi Attività</h3>
                <input type="hidden" id="current-vehicle-id">
                <input type="hidden" id="activity-index">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tipo Manutenzione</label>
                    <select id="activity-name" class="shadow appearance-none border rounded w-full py-2 px-3">
                        <!-- Opzioni caricate dinamicamente -->
                    </select>
                </div>
                <div id="custom-activity-container" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tipo Manutenzione Personalizzato</label>
                    <input type="text" id="custom-activity" class="shadow appearance-none border rounded w-full py-2 px-3"
                        placeholder="Inserisci il tipo di manutenzione">
                </div>
                <div id="custom-activity-container" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tipo Manutenzione Personalizzato</label>
                    <input type="text" id="custom-activity" class="shadow appearance-none border rounded w-full py-2 px-3"
                        placeholder="Inserisci il tipo di manutenzione">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Kilometri</label>
                    <input type="number" id="activity-km" class="shadow appearance-none border rounded w-full py-2 px-3">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Data</label>
                    <input type="date" id="activity-date" class="shadow appearance-none border rounded w-full py-2 px-3">
                </div>
                <div class="flex justify-end">
                    <button onclick="closeActivityModal()"
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded mr-2">
                        Annulla
                    </button>
                    <button id="save-activity-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Salva
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="/static/js/admin.js"></script>
    <script>
        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();

            // Setup logout button
            document.getElementById('logout-btn').addEventListener('click', logout);
        });

        // Auth check function
        function checkAuth() {
            
            if (!token) {
                window.location.href = '/login';
                return null;
            }
            return token;
        }

        // Logout function
        function logout() {
                // Invia una richiesta per rimuovere il cookie
                fetch('/logout', {
                    method: 'POST',
                    credentials: 'include'
                }).then(() => {
                    window.location.href = '/login';
                });
            }

        // Add authorization header to fetch requests
        const originalFetch = window.fetch;
        window.fetch = function (url, options = {}) {
            const token = localStorage.getItem('token');

            if (token && !url.includes('/token')) {
                options.headers = options.headers || {};

                // Don't override if Authorization is already set
                if (!options.headers.Authorization && !options.headers.authorization) {
                    options.headers.Authorization = `Bearer ${token}`;
                }
            }

            return originalFetch(url, options)
                .then(response => {
                    // Redirect to login if unauthorized
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        window.location.href = '/login';
                    }
                    return response;
                });
        };
    </script>
</body>

</html>
