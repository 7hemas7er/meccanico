<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronologia Manutenzioni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-white shadow-lg mb-6">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-4 md:space-x-7">
                    <div class="flex items-center">
                        <a href="/"
                            class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm md:text-base">Torna a
                            Veicoli</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <div class="bg-white shadow-md rounded-lg p-6">
            <div class="mb-6" id="vehicle-info">
                <h1 class="text-2xl font-bold mb-2">Cronologia Manutenzioni</h1>
                <p class="text-lg" id="vehicle-plate"></p>
            </div>

            <!-- Filtri -->
            <div class="mb-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo Manutenzione</label>
                    <select id="filter-type"
                        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">Tutti i tipi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Data Inizio</label>
                    <input type="date" id="filter-start-date"
                        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Data Fine</label>
                    <input type="date" id="filter-end-date"
                        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
            </div>

            <!-- Tabella Attività -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Data</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                KM</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="activities-list" class="bg-white divide-y divide-gray-200">
                        <!-- Le attività verranno inserite qui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Funzioni di filtro
        // Funzioni di filtro
            function filterActivities() {
                const typeFilter = document.getElementById('filter-type').value;
                const startDate = document.getElementById('filter-start-date').value;
                const endDate = document.getElementById('filter-end-date').value;

                const rows = document.querySelectorAll('#activities-list tr');
                rows.forEach(row => {
                    const type = row.getAttribute('data-type');
                    const date = row.getAttribute('data-date');

                    let showRow = true;
                    if (typeFilter && type !== typeFilter) showRow = false;
                    if (startDate && date < startDate) showRow = false;
                    if (endDate && date > endDate) showRow = false;

                    row.style.display = showRow ? '' : 'none';
                });
            }

            // Carica i dati del veicolo e le sue attività
            async function loadVehicleHistory() {
                const vehicleId = new URLSearchParams(window.location.search).get('id');
                if (!vehicleId) {
                    alert('ID veicolo non specificato');
                    return;
                }

                try {
                    const response = await fetch(`/api/vehicle/${vehicleId}`);
                    const vehicle = await response.json();

                    // Imposta le informazioni del veicolo
                    document.getElementById('vehicle-plate').textContent = `Targa: ${vehicle.license_plate}`;

                    // Ordina le attività per data (più recenti prima)
                    const sortedActivities = vehicle.activities.sort((a, b) =>
                        new Date(b.date) - new Date(a.date)
                    );

                    // Popola il filtro dei tipi (inclusi tipi personalizzati)
                    const types = new Set(vehicle.activities.map(a => a.activity));
                    const typeSelect = document.getElementById('filter-type');
                    typeSelect.innerHTML = '<option value="">Tutti i tipi</option>';
                    types.forEach(type => {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = type;
                        typeSelect.appendChild(option);
                    });

                    // Popola la tabella
                    const activitiesList = document.getElementById('activities-list');
                    activitiesList.innerHTML = sortedActivities.map(activity => `
            <tr data-type="${activity.activity}" data-date="${activity.date}">
                <td class="px-6 py-4 whitespace-nowrap">
                    ${new Date(activity.date).toLocaleDateString('it-IT')}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    ${activity.activity}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    ${activity.kilometers.toLocaleString('it-IT')} km
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <div class="flex space-x-2">
                        <button onclick="editActivity('${vehicleId}', '${activity.id}')"
                                class="text-blue-600 hover:text-blue-900">
                            Modifica
                        </button>
                        <button onclick="deleteActivity('${vehicleId}', '${activity.id}')"
                                class="text-red-600 hover:text-red-900">
                            Elimina
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');

                    // Aggiungi event listener per i filtri
                    document.getElementById('filter-type').addEventListener('change', filterActivities);
                    document.getElementById('filter-start-date').addEventListener('change', filterActivities);
                    document.getElementById('filter-end-date').addEventListener('change', filterActivities);

                } catch (error) {
                    console.error('Errore:', error);
                    alert('Errore nel caricamento della cronologia');
                }
            }

            // Funzione per modificare un'attività
            async function editActivity(vehicleId, activityId) {
                try {
                    // Redirect to admin page with query parameters
                    window.location.href = `/admin?edit=true&vehicleId=${vehicleId}&activityId=${activityId}`;
                } catch (error) {
                    console.error('Errore:', error);
                    alert('Errore nell\'apertura della modifica');
                }
            }

            // Funzione per eliminare un'attività
            async function deleteActivity(vehicleId, activityId) {
                if (!confirm('Sei sicuro di voler eliminare questa attività?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/vehicle/${vehicleId}/activity/${activityId}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Errore nell\'eliminazione');

                    // Ricarica i dati
                    loadVehicleHistory();
                } catch (error) {
                    console.error('Errore:', error);
                    alert('Errore durante l\'eliminazione dell\'attività');
                }
            }

            // Carica i dati all'avvio
            document.addEventListener('DOMContentLoaded', loadVehicleHistory);
    </script>
</body>

</html>
