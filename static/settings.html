<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostazioni - Gestione Veicoli</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-7">
                    <div class="flex items-center space-x-4">
                        <a href="/admin" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Gestione Veicoli</a>
                        <a href="/maintenance" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Tipi
                            Manutenzione</a>
                        <a href="/settings" class="bg-blue-500 text-white px-3 py-2 rounded-md">Impostazioni</a>
                        <a href="/backup" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Backup</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logout-btn" class="text-red-500 hover:text-red-700 px-3 py-2 rounded-md">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center">Impostazioni Account</h1>

        <div class="max-w-md mx-auto bg-white shadow-md rounded px-8 pt-6 pb-8 mb-8">
            <h2 class="text-xl font-bold mb-4">Informazioni Utente</h2>
            <div class="mb-6">
                <p class="text-gray-700 text-sm mb-1">Username:</p>
                <p id="user-username" class="font-bold"></p>
            </div>
            <div class="mb-6">
                <p class="text-gray-700 text-sm mb-1">Ultimo accesso:</p>
                <p id="user-last-login" class="font-bold"></p>
            </div>
        </div>

        <div class="max-w-md mx-auto bg-white shadow-md rounded px-8 pt-6 pb-8 mb-8">
            <h2 class="text-xl font-bold mb-4">Cambio Password</h2>

            <div id="success-message"
                class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                <span>Password aggiornata con successo!</span>
            </div>

            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <span id="error-text">Errore</span>
            </div>

            <form id="password-form" class="space-y-4">
                <div>
                    <label for="old-password" class="block text-gray-700 text-sm font-bold mb-2">Password
                        Attuale</label>
                    <input id="old-password" type="password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>

                <div>
                    <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">Nuova Password</label>
                    <input id="new-password" type="password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>

                <div>
                    <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Conferma
                        Password</label>
                    <input id="confirm-password" type="password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>

                <div>
                    <button type="submit"
                        class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Aggiorna Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check authentication and load user data
        document.addEventListener('DOMContentLoaded', function () {
            // Check auth
            checkAuth();

            // Load user data
            loadUserData();

            // Setup logout button
            document.getElementById('logout-btn').addEventListener('click', logout);

            // Password form handling
            const passwordForm = document.getElementById('password-form');
            passwordForm.addEventListener('submit', function (e) {
                e.preventDefault();

                const oldPassword = document.getElementById('old-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                // Validate passwords
                if (newPassword !== confirmPassword) {
                    document.getElementById('error-text').textContent = 'Le password non corrispondono';
                    document.getElementById('error-message').classList.remove('hidden');
                    document.getElementById('success-message').classList.add('hidden');
                    return;
                }

                // Update password
                changePassword(oldPassword, newPassword);
            });
        });

        // Auth check function
        function checkAuth() {
            fetch('/api/user', {
                credentials: 'include'
            })
                .then(response => {
                    if (!response.ok) {
                        window.location.href = '/login';
                    }
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        }

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch('/api/user', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Non autorizzato');
                }

                const userData = await response.json();

                // Display user info
                document.getElementById('user-username').textContent = userData.username;

                // Format last login date if exists
                if (userData.last_login) {
                    const lastLogin = new Date(userData.last_login);
                    document.getElementById('user-last-login').textContent = lastLogin.toLocaleString('it-IT');
                } else {
                    document.getElementById('user-last-login').textContent = 'Mai';
                }

            } catch (error) {
                console.error('Errore:', error);
                window.location.href = '/login';
            }
        }

        // Handle password change
        async function changePassword(oldPassword, newPassword) {
            try {
                const response = await fetch('/api/change-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('success-message').classList.remove('hidden');
                    document.getElementById('error-message').classList.add('hidden');
                    document.getElementById('password-form').reset();

                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        document.getElementById('success-message').classList.add('hidden');
                    }, 3000);

                } else {
                    throw new Error(data.detail || 'Errore durante il cambio password');
                }

            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('error-text').textContent = error.message;
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('success-message').classList.add('hidden');
            }
        }

        // Logout function
        function logout() {
            fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            }).then(() => {
                window.location.href = '/login';
            });
        }
    </script>
</body>

</html>
