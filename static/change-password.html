<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambia Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-7">
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Gestione Veicoli</a>
                        <a href="/maintenance" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md">Tipi
                            Manutenzione</a>
                        <a href="/change-password" class="bg-blue-500 text-white px-3 py-2 rounded-md">Cambia
                            Password</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6">Cambia Password Admin</h2>

            <form id="password-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="old-password">
                        Password Attuale
                    </label>
                    <input type="password" id="old-password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="new-password">
                        Nuova Password
                    </label>
                    <input type="password" id="new-password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password">
                        Conferma Nuova Password
                    </label>
                    <input type="password" id="confirm-password"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                </div>

                <button type="submit"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Cambia Password
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validazione
            if (newPassword !== confirmPassword) {
                alert('Le password non coincidono');
                return;
            }

            if (newPassword.length < 8) {
                alert('La nuova password deve essere di almeno 8 caratteri');
                return;
            }

            try {
                // Ottieni il token dai cookie o da localStorage
                const token = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('access_token='))
                    ?.split('=')[1] || localStorage.getItem('token');

                const response = await fetch('/api/change-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    alert('Password cambiata con successo');
                    document.getElementById('password-form').reset();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Errore durante il cambio password');
                }
            } catch (error) {
                console.error('Errore:', error);
                alert('Errore durante il cambio password');
            }
        });
    </script>
</body>

</html>
