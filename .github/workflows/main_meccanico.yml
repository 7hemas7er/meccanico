# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - meccanico

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://ghcr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_c84cc9650427445fb3798ed8096da0a9 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_cb8aa4e1434943babf38ceafe423e085 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: ghcr.io/${{ secrets.AzureAppService_ContainerUsername_c84cc9650427445fb3798ed8096da0a9 }}/7hemas7er/meccanico:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'meccanico'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_e7433b7ccec54466aa617347c5cb5ba9 }}
        images: 'ghcr.io/${{ secrets.AzureAppService_ContainerUsername_c84cc9650427445fb3798ed8096da0a9 }}/7hemas7er/meccanico:${{ github.sha }}'