# .github/workflows/main_meccanico.yml
name: Build and deploy container app to Azure Web App - meccanico

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push container image
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/meccanico:latest
        file: ./Dockerfile
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'meccanico'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_d1e84d58ab4f4dd6bd8ee746ff3b5186 }}
        images: 'ghcr.io/${{ github.repository_owner }}/meccanico:latest'
